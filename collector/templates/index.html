<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ed"><title>Config Manager</title><link rel="stylesheet" href="/static/app.css"></head><body><main><header><div><span class="eyebrow">CONFIG COLLECTOR</span><h1>مدیریت منابع کانفیگ</h1><p>جمع‌آوری مستقل، اعتبارسنجی و آمار زنده</p></div><span id="live" class="live">● زنده</span></header><section class="cards"><article><span>منابع</span><b id="sources">0</b></article><article><span>کانفیگ یکتا</span><b id="configs">0</b></article><article><span>سالم</span><b id="healthy">0</b></article><article><span>نیازمند بررسی</span><b id="errors">0</b></article></section><section class="panel add"><h2>افزودن لینک</h2><p>لینک‌ها را تکی یا گروهی، هرکدام در یک خط وارد کنید.</p><textarea id="urls" placeholder="https://example.com/sub"></textarea><div class="controls"><label>فاصله Fetch <span><input id="interval" type="number" value="10" min="2"> ثانیه</span></label><button onclick="add()">＋ افزودن منابع</button></div><div id="msg"></div></section><section class="panel"><div class="title"><div><h2>منابع</h2><p>آمار هر Fetch مستقل از تاریخچه است.</p></div><span id="updated"></span></div><div class="bulkbar"><label class="checkall"><input id="selectAll" type="checkbox" onchange="selectAll(this.checked)"> انتخاب همه</label><div><button id="deleteSelected" class="softdanger" onclick="deleteSelected()">حذف انتخاب‌شده‌ها</button><button class="softdanger" onclick="deleteAllSources()">حذف همه لینک‌ها</button><button class="dangerfill" onclick="deleteAllConfigs()">حذف همه کانفیگ‌های Fetch شده</button></div></div><div id="list" class="list"></div></section></main><script src="/static/app.js"></script></body></html>
