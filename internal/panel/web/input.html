{{define "input"}}

<details class="panel add-panel" id="import-panel" open><summary class="section-title"><div><h2>افزودن گروهی لینک‌ها</h2><p>هر خط یک لینک؛ نام هر منبع خودکار انتخاب می‌شود.</p></div><svg class="import-chevron"><use href="#i-chevron"/></svg></summary><form id="bulk-form"><label class="sr-only" for="bulk-links">لینک‌های منابع</label><textarea id="bulk-links" dir="ltr" rows="4" spellcheck="false" placeholder="https://example.com/Api/Verde/trun.php&#10;https://example.com/Api/Rosa/trun.php" required></textarea><div class="import-bottom"><div class="interval-field"><label for="bulk-interval">فاصلهٔ هر درخواست</label><div class="interval-control"><input id="bulk-interval" value="۲ تا ۳" inputmode="text" autocomplete="off" spellcheck="false" required aria-describedby="interval-help"><select id="bulk-unit" aria-label="واحد فاصلهٔ درخواست"><option value="minutes">دقیقه</option><option value="seconds">ثانیه</option></select></div><span id="interval-help" class="hint">یک مقدار یا یک بازه، مثل ۲ تا ۳</span></div><div class="timeout-field"><label for="bulk-timeout">تایم‌اوت دریافت (ثانیه)</label><input id="bulk-timeout" inputmode="numeric" placeholder="پیش‌فرض تنظیمات"><span class="hint">خالی: استفاده از تنظیمات مشترک</span></div><div class="import-action"><span id="bulk-count" class="hint">نام نمونه: Verde</span><button class="primary" type="submit"><svg><use href="#i-plus"/></svg><span>افزودن لینک‌ها</span></button></div></div><div id="bulk-result" class="form-result hidden" role="status"></div></form></details>
<section class="list-section"><div class="list-heading"><h2>منابع ورودی <span id="source-count" class="count-chip">۰</span></h2><label class="search-field"><svg><use href="#i-search"/></svg><input id="source-search" placeholder="جست‌وجوی نام یا لینک" aria-label="جست‌وجوی منابع"></label></div><div class="source-health" id="source-health" role="status"></div><div class="bulk-toolbar"><label class="check-label"><input type="checkbox" id="select-sources">انتخاب این صفحه</label><span id="source-selected" class="hint">۰ انتخاب</span><button type="button" class="secondary" data-source-batch="disable">غیرفعال‌کردن</button><button type="button" class="secondary" data-source-batch="enable">فعال‌کردن</button><button type="button" class="delete" data-source-batch="delete">حذف انتخاب‌شده‌ها</button><button type="button" class="delete push-start" id="delete-all-sources">حذف همه لینک‌ها</button></div><div id="source-list" class="source-list"><div class="loading">در حال خواندن منابع…</div></div><div class="pagination"><button class="secondary" id="previous-page" disabled>قبلی</button><span id="page-number">۱</span><button class="secondary" id="next-page" disabled>بعدی</button></div></section>

{{end}}
